name: Temporary customer SDK preparation
on:
  push:
    branches: [arena/e27dac95-target]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Resolve and format with pinned SDK
        run: |
          bash tool/ci_check.sh flutter pub get
          bash tool/ci_check.sh dart format lib test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib test pubspec.lock
          if git diff --cached --quiet; then
            echo 'Sources and lockfile already prepared'
          else
            git commit -m "Resolve and format offline customer module with Flutter 3.38.5"
            git push origin HEAD:arena/e27dac95-target
          fi
      - name: Analyze prepared customer source
        run: bash tool/ci_check.sh flutter analyze --no-pub
      - name: Test prepared customer source
        run: bash tool/ci_check.sh flutter test --no-pub --reporter expanded
