name: Flutter foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Flutter 3.38.5 / Web / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          cat "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == '3.38.5', version
          assert version['dartSdkVersion'].split()[0] == '3.10.4', version
          PY
          dart --version
          java -version

      - name: Verify platform scaffolds
        run: python3 tool/verify_scaffold.py

      - name: Run scaffold and native source regressions
        run: |
          python3 -m unittest discover -s test/tool -v
          g++ -std=c++17 -Wall -Wextra -Werror third_party/file_saver/test/file_saver_io_test.cpp -o "$RUNNER_TEMP/file-saver-io-test"
          "$RUNNER_TEMP/file-saver-io-test"

      - name: Resolve dependencies
        run: |
          bash tool/ci_check.sh flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Formatting diagnostics (does not accept unformatted commits)
        run: |
          dart format lib test
          python3 - <<'PYTHON'
          import base64, subprocess
          patch = subprocess.check_output(['git', 'diff', '--', 'lib', 'test'])
          if patch:
              encoded = base64.b64encode(patch).decode()
              for start in range(0, len(encoded), 4000):
                  print('::notice title=Formatting patch '+str(start//4000)+'::'+encoded[start:start+4000])
          PYTHON
          git diff --exit-code -- lib test

      - name: Verify Dart formatting
        run: bash tool/ci_check.sh dart format --output=none --set-exit-if-changed lib test

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-inputs
          path: |
            ${{ runner.temp }}/flutter-version.json
            pubspec.lock
          retention-days: 14
          if-no-files-found: error

      - name: Analyze Dart and Flutter code
        run: bash tool/ci_check.sh flutter analyze --no-pub

      - name: Run unit and widget tests
        run: bash tool/ci_check.sh flutter test --no-pub --reporter expanded --timeout 2m

      - name: Verify browser IndexedDB persistence
        run: bash tool/ci_check.sh flutter test --no-pub --platform chrome test/browser/customer_indexeddb_test.dart

      - name: Build Web release
        run: bash tool/ci_check.sh flutter build web --release --no-pub --no-web-resources-cdn

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719' # 16.0, compatible with Java 17
          packages: platform-tools # The legacy "tools" package is no longer available.
          log-accepted-android-sdk-licenses: false

      - name: Install Android build dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build Android debug APK
        run: bash tool/ci_check.sh flutter build apk --debug --no-pub

      - name: Android document writer native regressions
        working-directory: android
        run: bash ../tool/ci_check.sh ./gradlew :file_saver:testDebugUnitTest

      - name: Build Android release APK (debug signing only; not distribution signed)
        run: bash tool/ci_check.sh flutter build apk --release --no-pub

      - name: Upload build outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-and-android-debug
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/file_saver/test-results/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows release and native IO regressions
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        shell: bash
        run: bash tool/ci_check.sh flutter build windows --release --no-pub
      - name: Native Windows IO and filter regressions
        run: |
          cmake -S third_party/file_saver/test -B "$env:RUNNER_TEMP/saver-tests"
          cmake --build "$env:RUNNER_TEMP/saver-tests" --config Debug
          ctest --test-dir "$env:RUNNER_TEMP/saver-tests" -C Debug --output-on-failure
      - name: Upload Windows release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error
