name: Flutter foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Flutter 3.38.5 / Web / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          cat "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == '3.38.5', version
          assert version['dartSdkVersion'].split()[0] == '3.10.4', version
          PY
          dart --version
          java -version

      - name: Verify platform scaffolds
        run: python3 tool/verify_scaffold.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --set-exit-if-changed lib test

      # Retain formatter corrections and the resolved lockfile for diagnosis.
      # A formatter change still fails the job; this does not bypass the gate.
      - name: Capture verification inputs
        if: always()
        run: git diff --binary -- lib test > "$RUNNER_TEMP/format.patch"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-inputs
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/flutter-version.json
            pubspec.lock
          retention-days: 14
          if-no-files-found: error

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Build Web release
        run: flutter build web --release --no-pub

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-and-android-debug
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
