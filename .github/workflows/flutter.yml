name: Flutter foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Flutter 3.38.5 / Web / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Inspect prior Android setup failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import io, re, subprocess, zipfile
          result = subprocess.run(['gh', 'api', '--allow-escape-sequences', 'repos/RamezBadry85/Target/actions/jobs/125301714024/logs'], capture_output=True)
          data = result.stdout
          if data.startswith(b'PK'):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  data = b'\n'.join(archive.read(name) for name in archive.namelist())
          text = (data + result.stderr).decode('utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          selected = '\n'.join(line for line in text.splitlines() if re.search(r'error|failed|exception|not found|sdkmanager|Downloading|Wrong version', line, re.I))[-3800:]
          escaped = selected.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Prior Android failure log::' + escaped)
          PYTHON

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          cat "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == '3.38.5', version
          assert version['dartSdkVersion'].split()[0] == '3.10.4', version
          PY
          dart --version
          java -version

      - name: Verify platform scaffolds
        run: python3 tool/verify_scaffold.py

      - name: Resolve dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-inputs
          path: |
            ${{ runner.temp }}/flutter-version.json
            pubspec.lock
          retention-days: 14
          if-no-files-found: error

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub --reporter expanded

      - name: Build Web release
        run: flutter build web --release --no-pub

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload build outputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-and-android-debug
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
