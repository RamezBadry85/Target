name: Flutter foundation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_sources:
        description: 'One-time SDK formatting and lockfile bootstrap on the session branch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_sources && github.ref == 'refs/heads/arena/e27dac95-target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Generate formatter changes and lockfile with the pinned SDK
        run: |
          flutter pub get
          dart format lib test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib test pubspec.lock
          git commit -m "Format Flutter foundation and lock resolved dependencies"
          git push origin HEAD:arena/e27dac95-target

  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare_sources
    name: Flutter 3.38.5 / Web / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          cat "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == '3.38.5', version
          assert version['dartSdkVersion'].split()[0] == '3.10.4', version
          PY
          dart --version
          java -version

      - name: Verify platform scaffolds
        run: python3 tool/verify_scaffold.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --set-exit-if-changed lib test

      # Retain formatter corrections and the resolved lockfile for diagnosis.
      # A formatter change still fails the job; this does not bypass the gate.
      - name: Capture verification inputs
        if: always()
        run: git diff --binary -- lib test > "$RUNNER_TEMP/format.patch"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-inputs
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/flutter-version.json
            pubspec.lock
          retention-days: 14
          if-no-files-found: error

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Build Web release
        run: flutter build web --release --no-pub

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload build outputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-and-android-debug
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
